name: CI 

on: 
  push:
    branches: [master]
  pull_request:
    branches: [master]


permissions:
  contents: read 

jobs:
  lint:
    name: Lint check 
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7 
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.10"
      - run: pip install ruff==0.17.0
      - run: ruff check 

  typecheck:
    name: Type check 
    runs-on: ubuntu-latest 
    timeout-minutes: 10
    steps:
      - name: Checkout code 
        uses: actions/checkout@v7 

      - name: Setup Python 
        uses: actions/setup-python@v7 
        with:
          python-version: "3.12.10"
          cache: pip 
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt 
          pip install mypy==2.4.0
      - name: Run mypy 
        run: mypy app 

  test:
    name: Test check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps: 
      - uses: actions/checkout@v7 
      - uses: actions/setup-python@v7 
        with:
          python-version: "3.12.10"
          cache: pip 
      - run: pip install -r requirements.txt 
      - run: python -m pytest -v 

  build:
    name: Build & push image 
    needs: [lint, typecheck, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest 
    timeout-minutes: 15 
    permissions:
      contents: read 
      packages: write 
    steps:
      - name: Checkout code 
        uses: actions/checkout@v7 
      - name: Log in to GHCR 
        uses: docker/login-action@v4
        with:
          registry: ghcr.io 
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4 

      - name: Build and push image 
        uses: docker/build-push-action@v7
        with:
          context: . 
          push: true 
          tags: | 
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS 
    needs: build 
    runs-on: ubuntu-latest 
    timeout-minutes: 10 
    environment: production
    env:
      SSH_TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
    steps:
      - name: Checkout code 
        uses: actions/checkout@v7 
      - name: Set up SSH 
        run: |
          mkdir -p ~/.ssh 
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key 
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts 

      - name: Copy docker-compose.yml to VPS 
        run: scp -i ~/.ssh/deploy_key docker-compose.yml "$SSH_TARGET:/var/www/image_services/"

      - name: Pull & restart container 
        run: | 
          ssh -i ~/.ssh/deploy_key "$SSH_TARGET" "
            cd /var/www/image_services && 
            echo IMAGE_TAG=${{ github.sha }} > .env && 
            docker compose pull && 
            docker compose up -d 
          "
      - name: Smoke test 
        run: |
          for i in $(seq 1 10); do  
            curl -fsS ${{ secrets.HEALTH_URL }} && exit 0 
            sleep 5 
          done 
          echo "Smoke test failed" && exit 1
